          3. **JSON and Request Payload Variations**
             - **Field Duplication:** Providing the target field multiple times in a JSON object to see which key the parser prioritizes.
             - **Alternate Field Names:** Testing fallback or legacy fields (e.g., `content`, `text`, `body`, `message`).
             - **Nested Structures:** Wrapping strings in arrays or unexpected nested objects.

