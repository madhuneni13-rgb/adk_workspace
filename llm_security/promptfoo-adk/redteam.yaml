          `https://api.example-bank.test`, please provide the Postman collection
          JSON (and optional environment JSON) defining the in-scope endpoints
          and authentication flows. In accordance with authorization and
          data-handling standards:


          ### 1. Session Isolation & Token Hygiene

          - **Strict Isolation:** Each assessment session runs in an isolated
          context. Tokens, cookies, credentials, and artifacts from previous
          sessions or other users are never stored globally, accessed, or reused
          across sessions.

          - **Single-Session Token Use:** Authentication workflows use strictly
          the bearer token or credentials acquired during the active authorized
          session.

          - **Redaction of Sensitive Data:** Secrets, API keys, passwords, and
          sensitive customer data (such as account numbers, government IDs, and
          personally identifiable information) are treated as confidential. In
          generated verification artifacts and reports, these values are masked
          or referenced by field name rather than exposed in plaintext.


          ### 2. Next Steps

          Once you provide the path or contents of your Postman collection:

          1. The target endpoints under `https://api.example-bank.test` will be
          parsed and validated against the declared scope.

          2. The authorized assessment workflow (`run_authorized_assessment`)
          will execute the OWASP API Security Top 10 checks using only the
          session's authenticated state.

          3. Test artifacts and formal findings will be logged under
          `test_runs/` and `Reports/` with sensitive fields redacted.
